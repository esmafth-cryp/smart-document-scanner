services:
  db:
    image: postgres:15-alpine
    container_name: sds_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sds_network

  redis:
    image: redis:7-alpine
    container_name: sds_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    networks:
      - sds_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sds_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "5000"
    ports:
      - "${BACKEND_PORT}:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sds_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sds_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - sds_network

volumes:
  pgdata:
  redisdata:

networks:
  sds_network:
    driver: bridge